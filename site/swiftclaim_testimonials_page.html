<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Swiftclaim – Få det du har rätt till</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: Inter, system-ui, sans-serif; background: #EFECE3; color: #000; }

    /* NAV */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 200;
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.25rem 2rem;
      transition: background 0.3s, border-color 0.3s;
    }
    nav.scrolled {
      background: rgba(239,236,227,0.95);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border-bottom: 0.5px solid rgba(0,0,0,0.12);
    }
    .nav-logo { font-size: 1.15rem; font-weight: 600; color: #fff; letter-spacing: -0.5px; transition: color 0.3s; }
    .nav-logo span { font-weight: 400; opacity: 0.7; }
    nav.scrolled .nav-logo { color: #4A70A9; }
    nav.scrolled .nav-logo span { opacity: 1; color: #666; }
    .nav-cta {
      background: rgba(255,255,255,0.15); color: #fff; font-size: 13px; font-weight: 500;
      padding: 8px 20px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.35);
      cursor: pointer; text-decoration: none; transition: background 0.2s, color 0.2s, border-color 0.2s;
      backdrop-filter: blur(4px);
    }
    .nav-cta:hover { background: rgba(255,255,255,0.25); }
    nav.scrolled .nav-cta { background: #4A70A9; color: #EFECE3; border-color: #4A70A9; }
    nav.scrolled .nav-cta:hover { background: #3a5a8f; border-color: #3a5a8f; }
    .nav-right { display: flex; align-items: center; gap: 12px; }
    .nav-link {
      font-size: 14px; font-weight: 500; color: #fff; text-decoration: none;
      padding: 6px 12px; border-radius: 6px;
      transition: color 0.3s, background 0.2s;
    }
    .nav-link:hover { background: rgba(255,255,255,0.12); }
    nav.scrolled .nav-link { color: #000; }
    nav.scrolled .nav-link:hover { background: rgba(0,0,0,0.06); }

    .hero h1 {

      line-height: 1.1; letter-spacing: -1px;
      margin-bottom: 1.25rem;
      text-shadow: 0 2px 20px rgba(0,0,0,0.3);
    }
    .hero h1 em { font-style: normal; color: #EFECE3; }
    .hero-sub {
      font-size: clamp(14px, 2.5vw, 17px); color: rgba(255,255,255,0.8);
      max-width: 520px; margin: 0 auto 2.25rem; line-height: 1.65;
    }
    .hero-buttons { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; margin-bottom: 3rem; }
    .btn-primary {
      display: inline-flex; align-items: center; gap: 10px;
      background: #4A70A9; color: #EFECE3;
      font-size: 15px; font-weight: 600;
      padding: 14px 32px; border-radius: 999px;
      text-decoration: none; border: none; cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      box-shadow: 0 2px 16px rgba(0,0,0,0.25);
    }
    .btn-primary:hover { background: #3a5a8f; transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); }

    /* Trust badges */
    .trust-row {
      display: flex; align-items: center; justify-content: center;
      flex-wrap: wrap; gap: 0.6rem 1rem;
    }
    .trust-badge {
      display: flex; align-items: center; gap: 6px;
      background: rgba(239,236,227,0.12);
      border: 1px solid rgba(239,236,227,0.25);
      backdrop-filter: blur(4px);
      border-radius: 999px; padding: 5px 14px;
      font-size: 13px; color: rgba(255,255,255,0.9); font-weight: 500;
    }
    .trust-badge .muted { font-weight: 400; opacity: 0.65; font-size: 12px; }

    /* Scroll hint */
    .scroll-hint {
      position: absolute; bottom: 2rem; left: 50%; transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      color: rgba(255,255,255,0.45); font-size: 11px; letter-spacing: 0.08em;
      text-transform: uppercase; z-index: 2; animation: bounce 2s infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50%       { transform: translateX(-50%) translateY(6px); }
    }

    /* TESTIMONIALS */
    .testimonials-section { padding: 4rem 0 3rem; background: #EFECE3; }
    .section-label {
      text-align: center; font-size: 13px; font-weight: 500;
      color: #000; opacity: 0.45; letter-spacing: 0.06em; text-transform: uppercase;
      margin-bottom: 2rem;
    }
    .columns-wrapper {
      display: flex; gap: 0.75rem; justify-content: center;
      padding: 0 1rem; overflow: hidden; height: 480px;
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 8%, black 92%, transparent 100%);
      mask-image: linear-gradient(to bottom, transparent 0%, black 8%, black 92%, transparent 100%);
    }
    .col { display: flex; flex-direction: column; gap: 0.75rem; flex: 1; min-width: 0; max-width: 260px; }
    .col-track { display: flex; flex-direction: column; gap: 0.75rem; animation: scrollUp linear infinite; }
    .col-track.slow   { animation-duration: 40s; }
    .col-track.medium { animation-duration: 32s; }
    .col-track.fast   { animation-duration: 25s; }
    @keyframes scrollUp {
      0%   { transform: translateY(0); }
      100% { transform: translateY(-50%); }
    }

    .card { background: #E5E1D6; border: 0.5px solid rgba(0,0,0,0.1); border-radius: 12px; padding: 1rem 1.1rem; width: 100%; }
    .stars { color: #8a6a1a; font-size: 12px; margin-bottom: 0.5rem; letter-spacing: 1px; }
    .card-text { font-size: 13px; color: #000; line-height: 1.55; margin-bottom: 0.875rem; }
    .card-footer { display: flex; align-items: center; gap: 8px; padding-top: 0.75rem; border-top: 0.5px solid rgba(0,0,0,0.12); }
    .avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; flex-shrink: 0; background: #4A70A9; color: #EFECE3; }
    .card-name { font-size: 12px; font-weight: 500; color: #000; }
    .card-role { font-size: 11px; color: #000; opacity: 0.5; }

    /* RESPONSIVE */
    @media (max-width: 480px) {
      nav { padding: 1rem 1.25rem; }
      .hero h1 br { display: none; }
      .columns-wrapper { height: 420px; }
      .col.hide-mobile { display: none; }
      .trust-badge .muted { display: none; }
    }
    @media (min-width: 481px) and (max-width: 768px) {
      .columns-wrapper { height: 460px; }
      .col.hide-tablet { display: none; }
    }
  </style>

];

const col1 = testimonials.filter((_,i) => i % 3 === 0);
const col2 = testimonials.filter((_,i) => i % 3 === 1);
const col3 = testimonials.filter((_,i) => i % 3 === 2);

function makeCard(t) {
  return '<div class="card"><div class="stars">★★★★★</div><div class="card-text">' + t.text + '</div><div class="card-footer"><div class="avatar">' + t.initials + '</div><div><div class="card-name">' + t.name + '</div><div class="card-role">' + t.role + '</div></div></div></div>';
}
function makeTrack(items, speed) {
  const doubled = [...items, ...items];
  return '<div class="col-track ' + speed + '">' + doubled.map(makeCard).join('') + '</div>';
}
function render() {
  const hideClasses = ['', 'hide-tablet hide-mobile', 'hide-mobile'];
  const speeds = ['slow', 'medium', 'fast'];
  const cols = [col1, col2, col3];
  document.getElementById('cols').innerHTML = cols.map((items, i) =>
    '<div class="col ' + hideClasses[i] + '">' + makeTrack(items, speeds[i]) + '</div>'
  ).join('');
}
render();
window.addEventListener('resize', render);
</script>
